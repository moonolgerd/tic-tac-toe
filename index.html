<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <!-- Score Board -->
    <div class="scoreboard">
      <div class="score" id="score-x">
        <span class="player-label x">X</span>
        <span class="score-value" id="wins-x">0</span>
      </div>
      <div class="score" id="score-draw">
        <span class="player-label draw">Draws</span>
        <span class="score-value" id="wins-draw">0</span>
      </div>
      <div class="score" id="score-o">
        <span class="player-label o">O</span>
        <span class="score-value" id="wins-o">0</span>
      </div>
    </div>

    <!-- Status Message -->
    <div class="status" id="status">Player <span class="x">X</span>'s turn</div>

    <!-- Game Board -->
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="btn-restart">Restart Game</button>
      <button id="btn-reset-scores">Reset Scores</button>
    </div>

    <!-- Win overlay -->
    <div class="overlay hidden" id="overlay">
      <div class="overlay-box">
        <div class="overlay-message" id="overlay-message"></div>
        <button id="btn-next">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
